<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLICE STORM — Arcade Cyber Slicing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      touch-action: none;
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* HUD OVERLAY */
    #hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-badge {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 24px;
      border: 1.5px solid rgba(244, 63, 94, 0.5);
      font-size: 20px;
      font-weight: 900;
      color: #fb7185;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.3);
    }

    .strikes-badge {
      display: flex;
      gap: 6px;
      font-size: 24px;
    }

    /* COMBO NOTIFICATION BANNER */
    #combo-banner {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      padding: 8px 28px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* START & GAME OVER MODALS */
    .game-modal {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .modal-title {
      font-size: 42px;
      font-weight: 900;
      color: #f43f5e;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    .btn-play-primary {
      margin-top: 24px;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      border: none;
      padding: 16px 52px;
      border-radius: 32px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(244, 63, 94, 0.6);
      transition: transform 0.15s;
    }

    .btn-play-primary:hover { transform: scale(1.06); }
    .btn-play-primary:active { transform: scale(0.95); }
  </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- HUD LAYER -->
<div id="hud-overlay">
  <div class="hud-top-bar">
    <div class="hud-badge" id="lbl-score">✨ 0</div>
    <div class="hud-badge strikes-badge" id="lbl-strikes">❌ ❌ ❌</div>
  </div>

  <div id="combo-banner">3x COMBO BLITZ!</div>
</div>

<!-- START / GAME OVER MODAL -->
<div class="game-modal" id="start-modal">
  <h1 class="modal-title">🍉 SLICE STORM</h1>
  <p style="color:#94a3b8; font-size:15px; margin-top:10px; max-width:340px;">
    Swipe your blade to slice flying <b>Plasma Melons</b>, <b>Neon Apples</b>, and <b>Crystal Berries</b>! Trigger multi-fruit combos and avoid <b>Hazard Bombs (💣)</b>!
  </p>
  <div style="margin-top:16px; font-size:14px; color:#38bdf8; font-weight:700;">
    Controls: Click/Touch & Drag to Swipe Blade
  </div>
  <button class="btn-play-primary" id="btn-start-game">START SLICING</button>
</div>

<!-- SOUND SYNTHESIZER -->
<script>
class SliceAudio {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  play(f, d = 0.15, type = "sine", gain = 0.2) {
    try {
      this.init();
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, this.ctx.currentTime);
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + d);
    } catch(e) {}
  }
}
const sfx = new SliceAudio();
</script>

<!-- 2D FLUID SLICING GAME ENGINE -->
<script>
class SliceStormEngine {
  constructor() {
    this.canvas = document.getElementById("game-canvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();

    this.score = 0;
    this.strikes = 0;
    this.maxStrikes = 3;
    this.isPlaying = false;

    this.fruits = [];
    this.splitHalves = [];
    this.particles = [];
    this.splatters = [];
    this.swipeTrail = [];

    this.isSwiping = false;
    this.lastSpawnTime = 0;
    this.spawnInterval = 1.4;

    this.fruitCatalog = [
      { name: "Plasma Melon", color: "#10b981", innerColor: "#ef4444", radius: 42, points: 15 },
      { name: "Neon Apple", color: "#f43f5e", innerColor: "#fecdd3", radius: 32, points: 10 },
      { name: "Crystal Berry", color: "#8b5cf6", innerColor: "#c4b5fd", radius: 24, points: 25 },
      { name: "Energy Pod", color: "#06b6d4", innerColor: "#a5f3fc", radius: 36, points: 20 },
      { name: "Hazard Bomb", color: "#1e293b", innerColor: "#ef4444", radius: 35, isBomb: true }
    ];

    this.bindEvents();
  }

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }

  bindEvents() {
    window.addEventListener("resize", () => this.resize());

    const onPointerDown = (x, y) => {
      this.isSwiping = true;
      this.swipeTrail = [{ x, y, time: performance.now() }];
      sfx.play(700, 0.08, "triangle", 0.15);
    };

    const onPointerMove = (x, y) => {
      if (!this.isSwiping) return;
      const now = performance.now();
      this.swipeTrail.push({ x, y, time: now });
      this.checkSlices(x, y);
    };

    const onPointerUp = () => {
      this.isSwiping = false;
    };

    // Mouse Events
    this.canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
    this.canvas.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onPointerUp);

    // Touch Events
    this.canvas.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      onPointerDown(t.clientX, t.clientY);
    });
    this.canvas.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      onPointerMove(t.clientX, t.clientY);
    });
    window.addEventListener("touchend", onPointerUp);

    document.getElementById("btn-start-game").onclick = () => {
      document.getElementById("start-modal").style.display = "none";
      this.startGame();
    };
  }

  startGame() {
    this.score = 0;
    this.strikes = 0;
    this.fruits = [];
    this.splitHalves = [];
    this.particles = [];
    this.splatters = [];
    this.swipeTrail = [];
    this.updateHUD();
    this.isPlaying = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.gameLoop.bind(this));
  }

  updateHUD() {
    document.getElementById("lbl-score").innerText = `✨ ${this.score.toLocaleString()}`;
    let str = "";
    for (let i = 0; i < this.maxStrikes; i++) {
      str += i < this.strikes ? "❌ " : "⭕ ";
    }
    document.getElementById("lbl-strikes").innerText = str;
  }

  spawnWave() {
    const count = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const isBomb = Math.random() < 0.22;
      const item = isBomb ? this.fruitCatalog[4] : this.fruitCatalog[Math.floor(Math.random() * 4)];

      const x = (this.canvas.width * 0.2) + Math.random() * (this.canvas.width * 0.6);
      const y = this.canvas.height + 40;
      const vx = (Math.random() - 0.5) * 6.0;
      const vy = -(14.0 + Math.random() * 4.5);
      const rot = 0;
      const vRot = (Math.random() - 0.5) * 0.1;

      this.fruits.push({ ...item, x, y, vx, vy, rot, vRot });
    }
  }

  checkSlices(x, y) {
    if (this.swipeTrail.length < 2) return;
    const p1 = this.swipeTrail[this.swipeTrail.length - 2];
    const p2 = { x, y };

    let slicedThisFrame = 0;

    for (let i = this.fruits.length - 1; i >= 0; i--) {
      const f = this.fruits[i];
      const dist = Math.hypot(f.x - x, f.y - y);

      if (dist < f.radius + 15) {
        // Slice hit!
        if (f.isBomb) {
          sfx.play(120, 0.5, "sawtooth", 0.4);
          this.triggerBombExplosion(f.x, f.y);
          this.fruits.splice(i, 1);
          this.strikes++;
          this.updateHUD();
          if (this.strikes >= this.maxStrikes) {
            this.gameOver();
            return;
          }
        } else {
          // Fruit sliced
          sfx.play(850 + Math.random() * 200, 0.12, "triangle", 0.25);
          this.splitFruit(f, p1, p2);
          this.fruits.splice(i, 1);
          this.score += f.points;
          slicedThisFrame++;
        }
      }
    }

    if (slicedThisFrame > 1) {
      this.triggerCombo(slicedThisFrame);
    }
    this.updateHUD();
  }

  triggerCombo(count) {
    const bonus = count * 25;
    this.score += bonus;
    sfx.play(1100, 0.2, "sine", 0.3);
    const banner = document.getElementById("combo-banner");
    banner.innerText = `🔥 ${count}x COMBO BLITZ (+${bonus} PTS)!`;
    banner.style.transform = "translateX(-50%) scale(1.2)";
    setTimeout(() => { banner.style.transform = "translateX(-50%) scale(0)"; }, 1200);
  }

  splitFruit(f, p1, p2) {
    // Spawn 2 split halves
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const perpX = Math.cos(angle + Math.PI / 2) * 4;
    const perpY = Math.sin(angle + Math.PI / 2) * 4;

    this.splitHalves.push({
      ...f,
      x: f.x,
      y: f.y,
      vx: f.vx - perpX,
      vy: f.vy - perpY,
      rot: f.rot,
      vRot: -0.1,
      isLeftHalf: true
    });

    this.splitHalves.push({
      ...f,
      x: f.x,
      y: f.y,
      vx: f.vx + perpX,
      vy: f.vy + perpY,
      rot: f.rot,
      vRot: 0.1,
      isLeftHalf: false
    });

    // Spawn Splatter on background
    this.splatters.push({
      x: f.x,
      y: f.y,
      color: f.juiceColor || f.innerColor,
      radius: f.radius * 0.8,
      alpha: 0.6
    });

    // Particle Burst
    for (let i = 0; i < 16; i++) {
      this.particles.push({
        x: f.x,
        y: f.y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        color: f.innerColor,
        radius: 3 + Math.random() * 4,
        life: 1.0
      });
    }
  }

  triggerBombExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.5) * 16,
        color: "#ef4444",
        radius: 4 + Math.random() * 6,
        life: 1.2
      });
    }
  }

  gameOver() {
    this.isPlaying = false;
    sfx.play(140, 0.6, "sawtooth");
    document.getElementById("start-modal").style.display = "flex";
    document.querySelector("#start-modal h1").innerText = "💥 STRIKE OUT";
    document.getElementById("btn-start-game").innerText = "RETRY STORM";
  }

  gameLoop(t) {
    if (!this.isPlaying) return;
    const dt = Math.min(0.1, (t - this.lastTime) / 1000);
    this.lastTime = t;

    // Clear Canvas
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // Spawner
    if (t - this.lastSpawnTime > this.spawnInterval * 1000) {
      this.spawnWave();
      this.lastSpawnTime = t;
    }

    // Draw Background Splatters
    for (let i = this.splatters.length - 1; i >= 0; i--) {
      const sp = this.splatters[i];
      sp.alpha -= 0.05 * dt;
      if (sp.alpha <= 0) {
        this.splatters.splice(i, 1);
        continue;
      }
      this.ctx.save();
      this.ctx.globalAlpha = sp.alpha;
      this.ctx.fillStyle = sp.color;
      this.ctx.beginPath();
      this.ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();
    }

    // Update Fruits
    for (let i = this.fruits.length - 1; i >= 0; i--) {
      const f = this.fruits[i];
      f.x += f.vx;
      f.y += f.vy;
      f.vy += 22.0 * dt; // Gravity
      f.rot += f.vRot;

      // Draw Fruit
      this.ctx.save();
      this.ctx.translate(f.x, f.y);
      this.ctx.rotate(f.rot);

      if (f.isBomb) {
        this.ctx.fillStyle = "#1e293b";
        this.ctx.beginPath();
        this.ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.strokeStyle = "#ef4444";
        this.ctx.lineWidth = 3;
        this.ctx.stroke();
        // Fuse spark
        this.ctx.fillStyle = "#facc15";
        this.ctx.fillRect(-4, -f.radius - 8, 8, 8);
      } else {
        this.ctx.fillStyle = f.color;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.strokeStyle = "rgba(255,255,255,0.4)";
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
      }

      this.ctx.restore();

      // Check drop off bottom
      if (f.y > this.canvas.height + 60 && f.vy > 0) {
        if (!f.isBomb) {
          this.strikes++;
          this.updateHUD();
          if (this.strikes >= this.maxStrikes) {
            this.gameOver();
            return;
          }
        }
        this.fruits.splice(i, 1);
      }
    }

    // Update Split Halves
    for (let i = this.splitHalves.length - 1; i >= 0; i--) {
      const h = this.splitHalves[i];
      h.x += h.vx;
      h.y += h.vy;
      h.vy += 24.0 * dt;
      h.rot += h.vRot;

      this.ctx.save();
      this.ctx.translate(h.x, h.y);
      this.ctx.rotate(h.rot);
      this.ctx.fillStyle = h.innerColor;
      this.ctx.beginPath();
      this.ctx.arc(0, 0, h.radius * 0.9, h.isLeftHalf ? Math.PI / 2 : -Math.PI / 2, h.isLeftHalf ? -Math.PI / 2 : Math.PI / 2);
      this.ctx.fill();
      this.ctx.restore();

      if (h.y > this.canvas.height + 80) {
        this.splitHalves.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 1.8 * dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      this.ctx.save();
      this.ctx.globalAlpha = p.life;
      this.ctx.fillStyle = p.color;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();
    }

    // Draw Blade Swipe Trail
    const now = performance.now();
    this.swipeTrail = this.swipeTrail.filter(p => now - p.time < 120);

    if (this.swipeTrail.length > 1) {
      this.ctx.save();
      for (let i = 1; i < this.swipeTrail.length; i++) {
        const p1 = this.swipeTrail[i - 1];
        const p2 = this.swipeTrail[i];
        const age = (now - p2.time) / 120;
        const width = (1 - age) * 8;

        this.ctx.strokeStyle = `rgba(244, 63, 94, ${1 - age})`;
        this.ctx.lineWidth = width;
        this.ctx.lineCap = "round";
        this.ctx.beginPath();
        this.ctx.moveTo(p1.x, p1.y);
        this.ctx.lineTo(p2.x, p2.y);
        this.ctx.stroke();
      }
      this.ctx.restore();
    }

    requestAnimationFrame(this.gameLoop.bind(this));
  }
}

window.addEventListener("DOMContentLoaded", () => {
  window.game = new SliceStormEngine();
});
</script>

</body>
</html>
