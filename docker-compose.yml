version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://storm_user:storm_pass@db:5432/slice_storm
      - JWT_SECRET=slice_storm_secret_jwt_key_2026
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-placeholder}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=storm_user
      - POSTGRES_PASSWORD=storm_pass
      - POSTGRES_DB=slice_storm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
